# The groups a keyboard cheatsheet sorts bindings into, and the words that put
# a binding in one.
#
# This is the default, and it deliberately covers only what sway's own example
# configuration binds. Anything past that is somebody's particular setup, so
# copy this to ~/.config/sway-cheatsheet/groups.toml and add to it there.
#
# Order is both the order groups are tried in and the order they are printed
# in. It matters that it is one list rather than two, because the words
# overlap: "move container to workspace" is about workspaces although it moves
# a window, so Workspaces has to be written above Move.
#
# keywords are matched against the command and its comment, lower-cased.
# command_starts_with is matched against the command alone.

fallback = "Other"

# Matching runs in the order the groups are written below, most specific
# first. This is the order they are printed in, which is not the same thing:
# what you press constantly comes before what you press once a day.
order = ["Focus", "Move", "Size", "Layout", "Windows", "Workspaces", "Launch", "Session"]

[[group]]
name = "Workspaces"
keywords = ["workspace"]

[[group]]
name = "Focus"
keywords = ["focus"]

[[group]]
name = "Move"
keywords = ["move", "swap"]

[[group]]
name = "Size"
keywords = ["resize"]

[[group]]
name = "Layout"
keywords = ["split", "layout", "tabbed", "stacking", "fullscreen", "floating", "scratchpad"]

[[group]]
name = "Windows"
keywords = ["kill", "sticky", "border"]

[[group]]
name = "Session"
keywords = ["reload", "exit", "swaylock", "swaynag", "systemctl"]

[[group]]
name = "Launch"
command_starts_with = "exec"
